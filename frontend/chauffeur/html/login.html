<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TaxiGo — Connexion chauffeur</title>

<link rel="manifest" href="/chauffeur/manifest.webmanifest" />
<meta name="theme-color" content="#0D1B2A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TaxiGo Driver" />
<link rel="icon" type="image/png" sizes="32x32" href="/chauffeur/icons/chauffeur-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/chauffeur/icons/chauffeur-16.png" />
<link rel="shortcut icon" href="/chauffeur/icons/chauffeur-favicon.ico" />
<link rel="apple-touch-icon" href="/chauffeur/icons/chauffeur-180.png" />

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #111827;
  --ink-2:      #4b5563;
  --ink-3:      #9ca3af;
  --paper:      #f9fafb;
  --line:       #e5e7eb;
  --white:      #ffffff;
  --field-bg:   #f3f4f6;
  --accent:     #f97316;
  --accent-d:   #ea580c;
  --red:        #dc2626;
  --font-head:  'DM Sans', system-ui, sans-serif;
  --font-body:  'DM Sans', system-ui, sans-serif;
  --safe-top:   env(safe-area-inset-top, 0px);
  --safe-bot:   env(safe-area-inset-bottom, 0px);
}

html, body { min-height: 100%; }

body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  min-height: 100vh;
}

.wrap {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 48px) 24px calc(var(--safe-bot) + 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand {
  font-family: var(--font-head);
  font-size: 27px;            /* Augmenté de 27px à 29px pour compenser la petite hauteur de DM Sans */
  font-weight: 800;           /* Conservé comme demandé */
  letter-spacing: 0.5px;      /* Passé de -.4px à +0.5px pour étendre l'espace, typique du style étalé de Syne */
  color: var(--ink);
  text-decoration: none;

  /* ─── PROPRIÉTÉS AJOUTÉES POUR SIMULER 'SYNE' ─── */
  display: inline-block;      /* Nécessaire pour appliquer la transformation de largeur */
  transform: scaleX(1.25);    /* Étire horizontalement DM Sans de 25% (Syne à 800 est extrêmement large) */ 
  /* Optionnel : Un léger contour invisible pour booster le gras si le 800 de DM Sans reste trop fin */
  -webkit-text-stroke: 0.3px currentColor; 
}
.brand span { color: var(--accent); }

.role-tag {
  display: flex;
  align-items: center;
  margin-top: 8px;
  margin-bottom: 28px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent-d);
}

.pulse-dot {
  position: relative;
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
}
.pulse-dot::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .35;
  animation: pulse-ring 1.8s ease-out infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(.6); opacity: .5; }
  100% { transform: scale(1.9); opacity: 0; }
}

.card {
  width: 100%;
  background: var(--white);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: 0 24px 60px -12px rgba(17,24,39,.16), 0 4px 16px rgba(17,24,39,.06);
}

.card h1 {
  font-family: var(--font-head);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 22px;
  color: var(--ink);
}

label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
  margin-bottom: 6px;
  margin-top: 16px;
}
label:first-of-type { margin-top: 0; }

input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--field-bg);
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(249,115,22,.14);
  background: var(--white);
}

.field-wrap { position: relative; }

.toggle-pass {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  color: var(--ink-3);
  cursor: pointer;
  padding: 6px;
  display: flex;
  border-radius: 8px;
}
.toggle-pass:hover { color: var(--ink-2); }

button[type="submit"] {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: var(--white);
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s, opacity .18s;
}
button[type="submit"]:hover { background: var(--accent-d); }
button[type="submit"]:disabled { opacity: .65; cursor: not-allowed; }

.message {
  min-height: 18px;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--red);
}

.link-row {
  margin-top: 18px;
  text-align: center;
  font-size: 13.5px;
  color: var(--ink-2);
}
.link-row a { color: var(--accent-d); font-weight: 700; text-decoration: none; }
.link-row a:hover { text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
  <main class="wrap">

    <a href="/" class="brand">Taxi<span>Go</span></a>
    <span class="role-tag"><span class="pulse-dot"></span>Espace chauffeur</span>

    <div class="card">
      <h1>Connexion</h1>
      <form id="loginForm" novalidate>
        <label for="login">Email, téléphone ou plaque</label>
        <input id="login" name="login" type="text" autocomplete="username" placeholder="vous@exemple.com" required>

        <label for="password">Mot de passe</label>
        <div class="field-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <button type="submit" id="submitBtn">Se connecter</button>
        <div class="message" id="message"></div>
      </form>

      <div class="link-row">Pas encore de compte ? <a href="/chauffeur/register">S'inscrire</a></div>
    </div>

  </main>

  <script>
    const togglePass = document.getElementById("togglePass");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    togglePass.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      eyeIcon.innerHTML = show
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      togglePass.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
    });

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");
      message.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion…";

      try {
        const response = await fetch("/backend/chauffeur/login_chauffeur.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login: document.getElementById("login").value.trim(),
            password: passwordInput.value
          })
        });

        const result = await response.json();
        if (result.status === "success") {
          window.location.href = "/chauffeur";
        } else {
          message.textContent = result.message || "Connexion impossible";
        }
      } catch (err) {
        message.textContent = "Erreur réseau — vérifiez votre connexion";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
