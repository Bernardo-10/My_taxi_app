<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TaxiGo</title>
<meta name="description" content="TaxiGo — choisissez votre espace : client, chauffeur ou administration.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #111827;
  --ink-2:      #4b5563;
  --ink-3:      #9ca3af;
  --paper:      #f9fafb;
  --line:       #e5e7eb;
  --white:      #ffffff;
  --green:      #1db954;
  --green-bg:   #e8f8ee;
  --amber:      #f97316;
  --amber-bg:   rgba(249,115,22,.12);
  --font-head:  'Syne', sans-serif;
  --font-body:  'DM Sans', system-ui, sans-serif;
  --safe-top:   env(safe-area-inset-top, 0px);
  --safe-bot:   env(safe-area-inset-bottom, 0px);
}

html, body { min-height: 100%; }

body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  min-height: 100vh;
}

.portal {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 48px) 24px calc(var(--safe-bot) + 40px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Motif route (décoratif) ─────────────────────── */
.route-motif { margin-bottom: 18px; opacity: .9; }

/* ── Marque ───────────────────────────────────────── */
.brand {
  font-family: var(--font-head);
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.5px;
  color: var(--ink);
  text-decoration: none;
}
.brand span { color: var(--amber); }

.tagline {
  margin-top: 8px;
  margin-bottom: 40px;
  font-size: 14.5px;
  color: var(--ink-2);
  text-align: center;
}

/* ── Cartes d'espace ──────────────────────────────── */
.space-grid {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.space-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 1px 3px rgba(17,24,39,.04);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}

.space-card:active { transform: scale(.98); }

.space-card:hover {
  border-color: var(--ink-3);
  box-shadow: 0 8px 24px rgba(17,24,39,.08);
}

.space-card .icon {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.space-card[data-accent="client"] .icon    { background: var(--green-bg); color: var(--green); }
.space-card[data-accent="chauffeur"] .icon { background: var(--amber-bg); color: var(--amber); }

.space-card .text { flex: 1; min-width: 0; }

.space-card .title {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 2px;
}

.space-card .desc {
  display: block;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--ink-3);
}

.space-card .chevron { flex-shrink: 0; color: var(--ink-3); }

/* ── Lien admin (discret) ────────────────────────── */
.admin-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 32px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 10px;
  transition: color .15s, background .15s;
}

.admin-link:hover { color: var(--ink-2); background: var(--line); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
  <main class="portal">

    <svg class="route-motif" width="120" height="40" viewBox="0 0 120 40" fill="none" aria-hidden="true">
      <path d="M8 10 C 35 10, 30 30, 60 30 S 95 10, 112 10" stroke="#d1d5db" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
      <circle cx="8" cy="10" r="5" fill="#1db954"/>
      <circle cx="112" cy="10" r="5" fill="#f97316"/>
    </svg>

    <a href="/" class="brand">Taxi<span>Go</span></a>
    <p class="tagline">Choisissez votre espace pour continuer</p>

    <div class="space-grid">

      <a href="/client" class="space-card" data-accent="client">
        <span class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-7.2-7-12a7 7 0 1 1 14 0c0 4.8-7 12-7 12z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
        </span>
        <span class="text">
          <span class="title">Client</span>
          <span class="desc">Réservez une course et suivez votre chauffeur en temps réel</span>
        </span>
        <span class="chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>

      <a href="/chauffeur" class="space-card" data-accent="chauffeur">
        <span class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13l1.6-4.8A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.2L21 13"/>
            <path d="M3 13h18v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/>
            <circle cx="7.5" cy="16" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="16.5" cy="16" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="text">
          <span class="title">Chauffeur</span>
          <span class="desc">Recevez des courses et gérez vos trajets</span>
        </span>
        <span class="chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>

    </div>

    <a href="/admin" class="admin-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Accès administrateur
    </a>

  </main>
</body>
</html>
